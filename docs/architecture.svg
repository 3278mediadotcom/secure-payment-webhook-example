<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 720" font-family="monospace" font-size="13">
  <!-- Payment Provider -->
  <rect x="100" y="10" width="200" height="40" rx="6" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
  <text x="200" y="35" text-anchor="middle" fill="#ffffff">Payment Provider</text>

  <!-- Arrow -->
  <line x1="200" y1="50" x2="200" y2="80" stroke="#888" stroke-width="2"/>
  <polygon points="200,85 195,75 205,75" fill="#888"/>

  <!-- Webhook Request -->
  <rect x="100" y="85" width="200" height="40" rx="6" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="200" y="110" text-anchor="middle" fill="#ffffff">Webhook Request</text>

  <!-- Arrow -->
  <line x1="200" y1="125" x2="200" y2="155" stroke="#888" stroke-width="2"/>
  <polygon points="200,160 195,150 205,150" fill="#888"/>

  <!-- Signature Verification -->
  <rect x="60" y="160" width="280" height="50" rx="6" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="200" y="180" text-anchor="middle" fill="#ffffff">Signature Verification</text>
  <text x="200" y="198" text-anchor="middle" fill="#aaa" font-size="11">HMAC-SHA256 + timestamp check</text>

  <!-- Arrow -->
  <line x1="200" y1="210" x2="200" y2="240" stroke="#888" stroke-width="2"/>
  <polygon points="200,245 195,235 205,235" fill="#888"/>

  <!-- Replay Protection -->
  <rect x="60" y="245" width="280" height="50" rx="6" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="200" y="265" text-anchor="middle" fill="#ffffff">Replay Protection</text>
  <text x="200" y="283" text-anchor="middle" fill="#aaa" font-size="11">Timestamp validation</text>

  <!-- Arrow -->
  <line x1="200" y1="295" x2="200" y2="325" stroke="#888" stroke-width="2"/>
  <polygon points="200,330 195,320 205,320" fill="#888"/>

  <!-- Idempotency Layer -->
  <rect x="60" y="330" width="280" height="50" rx="6" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="200" y="350" text-anchor="middle" fill="#ffffff">Idempotency Layer</text>
  <text x="200" y="368" text-anchor="middle" fill="#aaa" font-size="11">Duplicate event detection</text>

  <!-- Arrow -->
  <line x1="200" y1="380" x2="200" y2="410" stroke="#888" stroke-width="2"/>
  <polygon points="200,415 195,405 205,405" fill="#888"/>

  <!-- Controller -->
  <rect x="100" y="415" width="200" height="40" rx="6" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="200" y="440" text-anchor="middle" fill="#ffffff">Controller</text>

  <!-- Arrow -->
  <line x1="200" y1="455" x2="200" y2="485" stroke="#888" stroke-width="2"/>
  <polygon points="200,490 195,480 205,480" fill="#888"/>

  <!-- Service Layer -->
  <rect x="100" y="490" width="200" height="40" rx="6" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="200" y="515" text-anchor="middle" fill="#ffffff">Service Layer</text>

  <!-- Arrow -->
  <line x1="200" y1="530" x2="200" y2="560" stroke="#888" stroke-width="2"/>
  <polygon points="200,565 195,555 205,555" fill="#888"/>

  <!-- Database -->
  <rect x="100" y="565" width="200" height="40" rx="6" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>
  <text x="200" y="590" text-anchor="middle" fill="#ffffff">Database</text>

  <!-- Side labels -->
  <text x="30" y="185" fill="#e94560" font-size="11">1</text>
  <text x="30" y="270" fill="#e94560" font-size="11">2</text>
  <text x="30" y="355" fill="#e94560" font-size="11">3</text>
  <text x="30" y="440" fill="#e94560" font-size="11">4</text>
  <text x="30" y="515" fill="#e94560" font-size="11">5</text>
</svg>